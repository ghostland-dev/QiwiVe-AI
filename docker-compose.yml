services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: bolt-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash-lite}
    restart: unless-stopped
    networks:
      - bolt-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: bolt-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - bolt-network

networks:
  bolt-network:
    driver: bridge

